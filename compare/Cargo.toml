[package]
name = "rustyass-compare"
description = "rustyass against libass: fidelity tests and benchmarks, libass being the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
libass-src = { path = "libass" }
png = "0.18"
rustyass = { path = ".." }

[build-dependencies]
pkg-config = "0.3"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "memory"
harness = false
